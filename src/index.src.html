<script>
/* тема до первой отрисовки (без мигания): сохранённый выбор → тема Telegram → настройка телефона */
(function () {
  var t = null;
  try { t = JSON.parse(localStorage.getItem("qz_theme")); } catch (e) {}
  if (t !== "light" && t !== "dark") {
    var w = window.Telegram && window.Telegram.WebApp;
    t = w && w.initData && (w.colorScheme === "dark" || w.colorScheme === "light") ? w.colorScheme
      : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>

<style>
/* Темы. Светлая — тёплый «песок и море»: фон слоновой кости вместо чисто белого (меньше слепит), карточки чуть светлее фона.
   Тёмная — ночной синий. Тему выбирает скрипт в <head> (сохранённый выбор → Telegram → настройка телефона) и ставит
   <html data-theme="light|dark">, поэтому все тёмные правила ниже — только через [data-theme="dark"]. */
:root {
  color-scheme: light;
  --ink: #0B2545; --sky: #1BB3D1; --sky-deep: #0B7F97; --sun: #FFC22E; --coral: #FF6B4F; --mist: #F4EFE7;
  --bg: var(--mist); --card: #FFFDF8; --text: var(--ink); --muted: #5A6677; --line: #E6DED1; --soft: #E5F2F1;
  --warn-bg: #FFF0C9; --warn-ink: #6B4E00; --ok-bg: #E1F3E6; --ok-ink: #0F6B3A; --ph: #E8E1D5;
  --bad-bg: #FDE6E0; --bad-ink: #8A2414;
  --shadow: 0 1px 2px rgba(64,44,14,.05), 0 10px 26px rgba(64,44,14,.07);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #071A30; --card: #0F2A4D; --text: #EAF4F8; --muted: #9FB6C9; --line: #1D3D66; --soft: #12385A; --sky-deep: #5FD3EA;
  --warn-bg: #3D3210; --warn-ink: #FFDD85; --ok-bg: #0F3B2A; --ok-ink: #8FE3B4; --ph: #17385F;
  --bad-bg: #4A1E17; --bad-ink: #FFB8A8;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.35);
}
body { transition: background-color .25s, color .25s; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.5 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
  padding: env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom));
}
body.modal-open { overflow: hidden; }
h1, h2, h3, .h3, .total .big, .dayhead b { font-family: 'Montserrat', 'Manrope', sans-serif; letter-spacing: -.015em; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--sky-deep); }
img { max-width: 100%; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; color: var(--muted); }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* header */
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 58px; }
.logo { display: flex; align-items: center; gap: 8px; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 17px; }
.logo svg { width: 30px; height: 30px; display: block; }
.langs { display: flex; background: var(--soft); border-radius: 999px; padding: 3px; }
.langs button { border: 0; background: transparent; padding: 7px 10px; border-radius: 999px; font-weight: 700; font-size: 12px; min-width: 40px; }
.langs button[aria-pressed="true"] { background: var(--card); box-shadow: var(--shadow); }
.top-r { display: flex; align-items: center; gap: 8px; }
.theme-btn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--soft); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; transition: transform .2s; }
.theme-btn:active { transform: rotate(-20deg) scale(.92); }
.theme-btn svg { width: 19px; height: 19px; }
.theme-btn .i-sun { display: none; }
:root[data-theme="dark"] .theme-btn { color: var(--sun); }
:root[data-theme="dark"] .theme-btn .i-sun { display: block; }
:root[data-theme="dark"] .theme-btn .i-moon { display: none; }
@media (max-width: 359px) { .langs button { min-width: 34px; padding: 7px 7px; } .logo { font-size: 15px; } }

/* tabs */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 9px 15px; font-weight: 700; font-size: 14px; min-height: 40px; }
.tabs button[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

/* hero */
.hero { margin: 14px 0 6px; padding: 22px 20px; border-radius: 26px; color: #fff; position: relative; overflow: hidden; background: var(--ink); }
.hero::before { content: ""; position: absolute; right: -58px; top: -58px; width: 104px; height: 104px; border-radius: 50%; border: 26px solid var(--sky); opacity: .9; }
.hero::after { content: ""; position: absolute; right: 12px; top: 12px; width: 18px; height: 18px; border-radius: 50%; background: var(--sun); }
.hero h1 { font-size: 22px; line-height: 1.22; max-width: 16ch; position: relative; font-weight: 800; }
.hero p { margin: 10px 0 0; opacity: .92; font-size: 14.5px; line-height: 1.5; max-width: 36ch; position: relative; }

/* planner */
section.step { margin-top: 22px; }
.step h2 { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.num { width: 26px; height: 26px; border-radius: 50%; background: var(--sky); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; font: 800 13px 'Manrope', sans-serif; flex: 0 0 auto; }
.grid { display: grid; gap: 10px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: 1fr 1fr 1fr; }
@media (max-width: 360px) { .g3 { grid-template-columns: 1fr 1fr; } }
.opt { border: 2px solid var(--line); background: var(--card); border-radius: 18px; padding: 12px; text-align: left; min-height: 56px; display: flex; align-items: center; gap: 10px; transition: border-color .15s, background .15s, transform .1s; }
.opt:active { transform: scale(.98); }
.opt[aria-pressed="true"] { border-color: var(--sky); background: var(--soft); }
.opt:disabled { opacity: .45; cursor: not-allowed; }
.opt .e { font-size: 24px; line-height: 1; }
.opt b { display: block; font-size: 15px; font-weight: 800; }
.opt small { color: var(--muted); font-size: 12px; }
.city, .style { flex-direction: column; align-items: flex-start; gap: 4px; position: relative; }
.city .e { font-size: 26px; }
.city .cflag { position: absolute; left: 10px; bottom: 10px; font-size: 13px; opacity: .85; }
.badge { position: absolute; right: 10px; top: 10px; display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--sky); color: var(--ink); font-size: 12px; font-weight: 800; }
.days { display: flex; gap: 8px; flex-wrap: wrap; }
.days .opt { min-height: 48px; padding: 0 16px; justify-content: center; font-weight: 800; }
input[type=date], input[type=number], input[type=search] { width: 100%; height: 48px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--text); padding: 0 14px; font: inherit; }
label.field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 700; }
.sub { font-size: 13px; color: var(--muted); font-weight: 700; margin: 10px 0 6px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 8px; }
.chips button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 13px; font-weight: 700; font-size: 13px; min-height: 38px; }
.chips button[aria-pressed="true"] { background: var(--sky); border-color: var(--sky); color: var(--ink); }
.chips button.auto[aria-pressed="true"] { background: var(--sun); border-color: var(--sun); }

/* bottom bar */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
.bar .wrap { padding: 0; }
.cta { width: 100%; min-height: 54px; border: 0; border-radius: 16px; background: var(--coral); color: var(--ink); font-weight: 800; font-size: 16px; }
.cta:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

/* result */
.card { background: var(--card); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); margin-top: 14px; }
.h3 { font-size: 14.5px; font-weight: 800; margin: 0 0 10px; }
.total { padding: 20px; color: #fff; background: var(--ink); position: relative; overflow: hidden; }
.total::after { content: ""; position: absolute; right: -40px; bottom: -40px; width: 130px; height: 130px; border-radius: 50%; border: 22px solid var(--sky); opacity: .35; }
.total .lbl { opacity: .78; font-size: 13px; font-weight: 700; }
.total .big { font-size: 28px; font-weight: 800; margin-top: 4px; }
.total .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; font-weight: 700; position: relative; }
.total .row span { background: rgba(255,255,255,.12); padding: 6px 10px; border-radius: 10px; }
.total .note { margin-top: 10px; font-size: 12px; opacity: .78; position: relative; max-width: 36ch; }
.ln { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.ln:last-child { border-bottom: 0; }
.ln b { white-space: nowrap; }
.back { border: 0; background: transparent; color: var(--sky-deep); font-weight: 700; padding: 14px 0 0; min-height: 44px; }
.note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
.ok { background: var(--ok-bg); color: var(--ok-ink); border-radius: 14px; padding: 10px 12px; font-size: 13px; font-weight: 700; }
.warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 14px; padding: 10px 12px; font-size: 13px; margin: 10px 0; }

/* route card */
.route-list { display: flex; flex-direction: column; margin: 4px 0; }
.rstop { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.rstop .ri { width: 40px; height: 40px; border-radius: 50%; background: var(--soft); display: inline-flex; align-items: center; justify-content: center; font-size: 20px; flex: 0 0 auto; }
.rstop b { font-size: 15px; }
.rstop .rd { color: var(--muted); font-size: 13px; font-weight: 600; }
.rstop .rtag { margin-left: auto; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--soft); color: var(--sky-deep); white-space: nowrap; }
.rleg { display: flex; align-items: flex-start; gap: 12px; padding: 2px 0 2px 0; }
.rleg .rl { width: 40px; display: flex; justify-content: center; flex: 0 0 auto; }
.rleg .rl span { width: 3px; height: 34px; background: var(--line); border-radius: 2px; display: block; }
.rleg .rt { font-size: 13px; color: var(--muted); padding-top: 6px; line-height: 1.4; }
.rleg .rt b { color: var(--text); }
.rsum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.rsum > div { background: var(--soft); border-radius: 14px; padding: 10px 12px; }
.rsum .v { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 18px; }
.rsum .k { font-size: 12px; color: var(--muted); font-weight: 700; }
.rsum .good { background: var(--ok-bg); } .rsum .good .v { color: var(--ok-ink); }

/* day cards */
.dayhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.dayhead b { font-size: 14px; font-weight: 800; }
.dayhead span { color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
.move { padding: 10px 12px; border-radius: 14px; background: var(--soft); font-weight: 700; margin-bottom: 6px; font-size: 14px; line-height: 1.45; }
.move .small { display: block; margin-top: 2px; font-weight: 600; }
.spot-item { padding: 11px 0; border-bottom: 1px solid var(--line); }
.spot-item:last-of-type { border-bottom: 0; }
.spot-main { display: grid; grid-template-columns: 74px 1fr; gap: 12px; align-items: center; color: inherit; }
.pic { width: 74px; height: 74px; border-radius: 16px; background: var(--ph); display: flex; align-items: center; justify-content: center; font-size: 26px; overflow: hidden; flex: 0 0 auto; }
.pic img, .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.spot-main .nm { font-weight: 800; line-height: 1.28; font-size: 15px; }
.meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 5px; }
.tag { font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--soft); color: var(--sky-deep); white-space: nowrap; }
.tag.paid { background: var(--warn-bg); color: var(--warn-ink); }
.spot-quick-bar { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
.pill-btn { border: 1px solid var(--line); background: var(--soft); color: var(--sky-deep); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 800; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; min-height: 32px; }
.pill-btn.accent { background: var(--ink); color: #fff; border-color: var(--ink); }
.story-inline { margin-top: 8px; border-radius: 14px; background: var(--soft); }
.story-inline summary { padding: 9px 12px; font-size: 13px; font-weight: 800; min-height: 40px; }
.story-inline summary::after { content: "+"; }
.story-inline[open] summary::after { content: "–"; }
.story-inline .sb { padding: 0 12px 12px; font-size: 13.5px; line-height: 1.55; }
.story-inline .sb p { margin: 0 0 8px; }
.story-inline .sb .fx { background: var(--card); border-radius: 10px; padding: 8px 10px; }
.route { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; min-height: 48px; border-radius: 14px; background: var(--soft); color: var(--sky-deep); font-weight: 800; text-decoration: none; }

/* city guide blocks */
details { border-top: 1px solid var(--line); }
details:first-of-type { border-top: 0; }
summary { list-style: none; cursor: pointer; padding: 14px 0; font-weight: 800; display: flex; justify-content: space-between; align-items: center; min-height: 48px; gap: 10px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-size: 22px; color: var(--sky-deep); font-weight: 600; flex: 0 0 auto; }
details[open] summary::after { content: "–"; }
.tip { display: flex; gap: 10px; padding: 9px 0; }
.tip .i { font-size: 20px; flex: 0 0 auto; width: 26px; text-align: center; }
.rest { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.rest:last-of-type { border-bottom: 0; }
.rest b { display: block; font-weight: 800; }
.rest .lv { font-weight: 800; color: var(--sky-deep); white-space: nowrap; }
.src { font-size: 12px; margin-top: 6px; color: var(--muted); }
.price-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.price-row:last-of-type { border-bottom: 0; }
.price-row .pn { font-weight: 700; font-size: 14px; }
.price-row .pv { font-weight: 800; white-space: nowrap; text-align: right; }
.price-row .pk { grid-column: 2; font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.price-row .pnote { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.shops { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.shops span { background: var(--soft); border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 700; }
.city-cover { position: relative; height: 150px; border-radius: 16px; overflow: hidden; background: var(--ph); margin-bottom: 12px; }
.city-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.city-cover .cc { position: absolute; left: 12px; bottom: 10px; color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 20px; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
.city-story { font-size: 14px; line-height: 1.6; }
.city-story .fx { background: var(--soft); border-radius: 12px; padding: 10px 12px; margin-top: 8px; font-size: 13.5px; }

/* phrasebook */
.ph { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ph:last-child { border-bottom: 0; }
.ph .loc { font-weight: 800; font-size: 17px; }
.ph .pr { color: var(--sky-deep); font-weight: 700; }
.ph .mean { color: var(--muted); font-size: 14px; grid-column: 1; }
.say { grid-row: 1 / 4; grid-column: 2; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--soft); font-size: 18px; }
.say.playing { background: var(--sun); }
.cat { margin: 16px 0 2px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* checklist */
.chk { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; min-height: 48px; }
.chk:last-child { border-bottom: 0; }
.chk input { width: 24px; height: 24px; accent-color: var(--sky); flex: 0 0 auto; }
.progress { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
.progress div { height: 100%; background: var(--sky); border-radius: 999px; transition: width .2s; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 60; background: var(--ink); color: #fff; padding: 12px 14px; border-radius: 14px; font-size: 14px; box-shadow: var(--shadow); max-width: 528px; margin: 0 auto; }
.toast a { color: var(--sun); font-weight: 800; }

/* stories reader */
.guide-toolbar { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
.guide-toolbar::-webkit-scrollbar { display: none; }
.guide-toolbar button { white-space: nowrap; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 9px 14px; font-weight: 800; font-size: 13px; }
.guide-toolbar button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.guide-search { margin: 4px 0 14px; }
.story-list { display: flex; flex-direction: column; gap: 16px; }
.story-card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); }
.cover { position: relative; width: 100%; aspect-ratio: 3 / 2; max-height: 240px; background: var(--ph); }
.story-city-badge { position: absolute; left: 14px; top: 14px; background: rgba(11,37,69,.82); backdrop-filter: blur(8px); color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; }
.story-body { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.story-title { font-family: 'Montserrat', 'Manrope', sans-serif; font-size: 19px; font-weight: 800; line-height: 1.25; }
.story-text { font-size: 15px; line-height: 1.68; margin: 0; }
.story-section-lbl { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--sky-deep); margin-bottom: 4px; display: block; }
.story-fact-box { background: var(--soft); border-radius: 14px; padding: 13px 14px; font-size: 14.5px; line-height: 1.6; }
.story-tip-box { background: var(--warn-bg); color: var(--warn-ink); border-radius: 12px; padding: 10px 13px; font-size: 13.5px; line-height: 1.5; }
.story-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 4px; }
.story-actions button, .story-actions a, .btn { border: 0; border-radius: 13px; padding: 12px 10px; font-size: 13px; font-weight: 800; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; }
.btn-soft { background: var(--soft); color: var(--ink); }
:root[data-theme="dark"] .btn-soft { color: var(--text); }
.btn-primary { background: var(--sky); color: #06243F; }
.btn-sun { background: var(--sun); color: #06243F; }
/* «Сапарыңмен бөліс»: сілтеме, WhatsApp, PDF кітапша, сторис */
.share-btns { display: grid; gap: 8px; }
.share-btns .btn { width: 100%; }
.share-btns .btn:disabled { opacity: .7; cursor: progress; }
.share-route { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 18px; }
.share-url { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: var(--soft); font-size: 12px; color: var(--muted); word-break: break-all; -webkit-user-select: all; user-select: all; }
.btn.pulse { animation: qzPulse 1.1s ease-in-out 4; }
@keyframes qzPulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--sun) 60%, transparent); } }
.story-footer-meta { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.story-footer-meta a { color: var(--muted); text-decoration: underline; }
.guide-empty { padding: 24px; text-align: center; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 18px; }

/* modal */
.modal-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(7,26,48,.72); backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center; padding: 12px; }
@media (min-width: 560px) { .modal-backdrop { align-items: center; } }
.modal-sheet { background: var(--card); color: var(--text); width: 100%; max-width: 520px; max-height: 90vh; border-radius: 24px; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,.45); position: relative; }
.modal-head { position: sticky; top: 0; z-index: 5; background: var(--card); padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.modal-head b { font-family: 'Montserrat', 'Manrope', sans-serif; font-size: 15px; font-weight: 800; }
.modal-close { border: 0; background: var(--soft); width: 34px; height: 34px; border-radius: 50%; font-weight: 800; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; }
.modal-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }

.copy-btn.done, .btn.done { background: var(--ok-bg); color: var(--ok-ink); }

/* visa */
.v-banner { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 12px; padding: 12px 14px; border: 0; border-radius: 18px; background: var(--sun); color: #06243F; text-align: left; font-weight: 700; font-size: 14px; line-height: 1.35; }
.v-banner > span { flex: 1; }
.v-banner b { white-space: nowrap; font-size: 13px; }
.v-dates { margin: 0 0 4px; font-weight: 800; }
.v-main { background: var(--soft); border-radius: 16px; padding: 12px 14px; margin-top: 10px; }
.v-main .k { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.v-main .v { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 22px; margin: 2px 0 4px; }
.v-big { font-weight: 800; margin: 0 0 8px; }
.v-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-wa { background: #25D366; color: #06243F; }
.btn-tg { background: #2AABEE; color: #fff; }
.cta-wa { display: flex; align-items: center; justify-content: center; text-decoration: none; background: #25D366; color: #06243F; }
.v-fee { margin-top: 10px; background: var(--warn-bg); color: var(--warn-ink); border-radius: 14px; padding: 10px 12px; font-size: 13px; line-height: 1.45; }
.v-steps { margin: 0; padding-left: 22px; } .v-steps li { margin: 6px 0; }
.v-faq { margin: 0 0 12px; font-size: 14px; line-height: 1.55; }
#vpResult > * { margin-top: 8px; }
.card .ok, .card .warn { margin: 8px 0 0; }
input[type=text] { width: 100%; height: 48px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--text); padding: 0 14px; font: inherit; }

/* install */
.install { display: flex; gap: 10px; align-items: center; margin-top: 12px; padding: 12px 12px 12px 14px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); }
.install-t { flex: 1; min-width: 0; }
.install-t b { font-size: 14px; }
.install-t p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.install .btn { flex: 0 0 auto; }
.install-x { border: 0; background: transparent; color: var(--muted); font-size: 15px; padding: 6px; align-self: flex-start; }

/* story editor */
.modal-sheet.st-sheet { max-height: 95vh; }
.st-body { gap: 10px; padding: 0 16px 18px; }
.st-top { position: sticky; top: 63px; z-index: 4; background: var(--card); padding: 12px 16px 10px; margin: 0 -16px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.st-stage { position: relative; height: min(42vh, 400px); aspect-ratio: 9 / 16; margin: 0 auto; border-radius: 18px; overflow: hidden; background: #0B2545; box-shadow: var(--shadow); flex: 0 0 auto; }
.st-stage canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.st-load { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: rgba(11,37,69,.82); color: #fff; font-size: 11.5px; font-weight: 800; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.st-shot { position: absolute; inset: 0; background: rgba(7,26,48,.94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 10px; }
.st-shot img { max-height: 84%; max-width: 100%; border-radius: 10px; -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }
.st-shot p { color: #fff; font-size: 12.5px; text-align: center; margin: 0; }
.st-shot .modal-close { position: absolute; right: 8px; top: 8px; }
.st-actions { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 8px; }
.st-actions .btn { min-height: 44px; padding: 8px 6px; }
.st-hint { margin: 0; text-align: center; font-size: 12px; }
.st-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.st-tabs::-webkit-scrollbar { display: none; }
.st-tabs button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 8px 12px; font-weight: 800; font-size: 13px; min-height: 38px; }
.st-tabs button[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.st-panel { display: flex; flex-direction: column; gap: 10px; min-height: 150px; }
.st-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.st-chips button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 8px 12px; font-weight: 700; font-size: 13px; min-height: 38px; }
.st-chips button[aria-pressed="true"] { background: var(--sky); border-color: var(--sky); color: #06243F; }
.st-input { width: 100%; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--text); padding: 10px 12px; font: inherit; font-size: 16px; }
textarea.st-input { resize: vertical; min-height: 104px; line-height: 1.45; }
.st-range { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: var(--muted); min-height: 40px; }
.st-range input { width: 100%; accent-color: var(--sky); }
.st-fonts { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.st-fonts::-webkit-scrollbar { display: none; }
.st-font { flex: 0 0 auto; min-width: 86px; border: 2px solid transparent; background: #1B3556; color: #fff; border-radius: 14px; padding: 8px 6px; min-height: 66px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; overflow: hidden; }
.st-font span { font-size: 26px; line-height: 1.15; white-space: nowrap; }
.st-font small { font: 700 11px 'Manrope', sans-serif; opacity: .85; }
.st-font.script span { font-size: 23px; }
.st-font[aria-pressed="true"] { border-color: var(--sun); }
.st-colors { display: flex; gap: 12px; flex-wrap: wrap; padding: 2px; }
.st-color { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line); }
.st-color[aria-pressed="true"] { outline: 3px solid var(--sky); outline-offset: 2px; }
.st-pills { display: flex; flex-wrap: wrap; gap: 8px; background: #3B536E; border-radius: 14px; padding: 10px; }
.st-pills button { border: 2px solid transparent; border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: 13px; }
.st-pills button[aria-pressed="true"] { border-color: #fff; }
.st-switch { display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 14px; }
.st-tog { width: 50px; height: 30px; border-radius: 999px; border: 0; background: var(--line); position: relative; flex: 0 0 auto; }
.st-tog i { position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.st-tog[aria-pressed="true"] { background: var(--sky); }
.st-tog[aria-pressed="true"] i { transform: translateX(20px); }
/* даты: выходные дни, праздники, события */
.dlist { display: flex; flex-direction: column; gap: 8px; }
.dl { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 13.5px; line-height: 1.45; padding: 9px 11px; border-radius: 12px; background: var(--soft); }
.dl b { font-weight: 800; }
.dl.closed { background: var(--bad-bg); color: var(--bad-ink); }
.dl.moved { background: var(--ok-bg); color: var(--ok-ink); }
.dl.holiday, .dl.check, .dl.partial { background: var(--warn-bg); color: var(--warn-ink); }
.spot-flag { margin-top: 7px; font-size: 12.5px; font-weight: 700; line-height: 1.4; padding: 6px 10px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-ink); }
.spot-flag.closed { background: var(--bad-bg); color: var(--bad-ink); }
.spot-flag a, .dl a { color: inherit; }
.day-flag { font-size: 12.5px; font-weight: 700; line-height: 1.4; padding: 7px 10px; border-radius: 10px; margin: 0 0 6px; background: var(--soft); }
.day-flag.holiday { background: var(--warn-bg); color: var(--warn-ink); }
.ord { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 6px 4px 4px; font-size: 13px; }
.ord button { border: 0; background: var(--soft); border-radius: 999px; min-width: 32px; min-height: 32px; font-weight: 800; }
.ord button:disabled { opacity: .35; }
.plan-ctrl { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 10px; }
/* в поездке: перевод цены и SOS */
.cv .field input { height: 56px; font-size: 24px; font-weight: 800; }
.cv-curs, .cv-quick { margin: 10px 0; }
.cv-out { background: var(--ink); color: #fff; border-radius: 16px; padding: 14px 16px; margin-top: 10px; }
.cv-main { font: 800 30px/1.15 'Montserrat', 'Manrope', sans-serif; letter-spacing: -.01em; }
.cv-sub { opacity: .8; font-weight: 700; font-size: 14px; margin-top: 4px; }
:root[data-theme="dark"] .cv-out { background: #071A30; border: 1px solid var(--line); }
.sos { padding: 0; overflow: hidden; }
.sos-112 { display: flex; gap: 14px; align-items: center; background: var(--coral); color: #06243F; padding: 14px 16px; text-decoration: none; font-size: 13.5px; line-height: 1.4; }
.sos-112 > b { font: 800 36px 'Montserrat', sans-serif; flex: 0 0 auto; }
.emb, .pr-city { border-top: 1px solid var(--line); padding: 12px 0; display: flex; flex-direction: column; gap: 6px; }
.emb:first-of-type { border-top: 0; padding-top: 2px; }
.emb-h { display: flex; gap: 8px; align-items: flex-start; font-size: 14.5px; line-height: 1.35; }
.emb-h b { flex: 1; }
.emb-c { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.emb-c .rtag { margin-left: auto; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--ok-bg); color: var(--ok-ink); }
.emb-addr { font-size: 13.5px; font-weight: 700; color: var(--sky-deep); text-decoration: none; }
.emb-ph { display: flex; justify-content: space-between; gap: 10px; align-items: center; background: var(--soft); border-radius: 12px; padding: 10px 12px; text-decoration: none; color: var(--text); font-size: 13px; min-height: 44px; }
.emb-ph b { white-space: nowrap; color: var(--sky-deep); font-size: 13.5px; }
.emb-ph.em { background: var(--bad-bg); color: var(--bad-ink); }
.emb-ph.em b { color: var(--bad-ink); }
.emb .small a, .pr-city .small a { color: var(--muted); }
.emb-h .rtag { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--ok-bg); color: var(--ok-ink); white-space: nowrap; }
.pr-item { background: var(--soft); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.pr-item .emb-addr .small { font-weight: 400; color: var(--muted); }
.pr-more { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px; }
.pr-more summary { cursor: pointer; font-weight: 800; font-size: 14px; color: var(--sky-deep); min-height: 32px; }
.pr-day { border-top: 1px solid var(--line); padding: 12px 0; }
.pr-day-h { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin-bottom: 8px; }
.pr-day-h span { color: var(--muted); font-weight: 700; white-space: nowrap; }
.pt-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.pt { background: var(--soft); border-radius: 10px; padding: 6px 2px; text-align: center; min-width: 0; }
.pt small { display: block; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pt b { font-size: 14px; font-variant-numeric: tabular-nums; }
.pt.pt-sun { background: transparent; border: 1px dashed var(--line); }
.pt.pt-sun b { color: var(--muted); font-weight: 600; }
.pr-line { font-size: 13.5px; line-height: 1.45; margin-top: 8px; }
.pr-line a { color: var(--sky-deep); text-decoration: none; }
.pr-line.pr-mat { background: var(--soft); border-radius: 12px; padding: 8px 10px; }
.pr-chips { margin-bottom: 10px; }
/* погода и где жить */
.wx-head, .wx-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr; gap: 6px; align-items: center; font-size: 13.5px; }
.wx-head { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 0 8px 4px; }
.wx-row { padding: 6px 8px; border-radius: 10px; font-variant-numeric: tabular-nums; }
.wx-row:nth-child(odd) { background: var(--soft); }
.wx-row.on { background: var(--sun); color: #06243F; }
.wx-row.on .muted { color: #06243F; opacity: .8; }
.wx-trip { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.wx-trip:last-of-type { border-bottom: 0; }
.wx-trip > span:last-child { white-space: nowrap; font-variant-numeric: tabular-nums; }
.stay { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
.stay:last-of-type { border-bottom: 0; }
.stay b { display: block; margin-bottom: 2px; }
.sos-tip { margin: 0 0 8px; font-size: 14px; line-height: 1.5; }
/* тёмная тема: тёмно-синие плашки (заголовок, итог, конвертер) отделяем от фона мягким градиентом и тонкой рамкой */
:root[data-theme="dark"] .hero, :root[data-theme="dark"] .total { background: linear-gradient(135deg, #133D6B 0%, #0B2545 72%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
:root[data-theme="dark"] .pill-btn.accent { background: var(--sky); border-color: var(--sky); color: #06243F; }
:root[data-theme="dark"] .cta:disabled { background: var(--soft); }
/* тёмная тема: выбранная вкладка голубая, иначе тёмно-синий сливается с фоном */
:root[data-theme="dark"] .tabs button[aria-selected="true"], :root[data-theme="dark"] .st-tabs button[aria-selected="true"],
:root[data-theme="dark"] .guide-toolbar button[aria-pressed="true"] { background: var(--sky); border-color: var(--sky); color: #06243F; }
/* колонки карточек (виза, в поездке): на телефоне одна колонка в исходном порядке */
.cols { display: flex; flex-direction: column; }
.col { display: contents; }

/* ===== Ноутбук и широкий экран ===== */
@media (min-width: 960px) {
  body { font-size: 15.5px; }
  .wrap { max-width: 1180px; padding: 0 32px; }
  .top .wrap { height: 64px; }
  .logo { font-size: 19px; }
  .logo svg { width: 34px; height: 34px; }
  .langs button { font-size: 13px; padding: 8px 12px; }
  /* вкладки всегда на виду, прилипают под шапкой */
  .tabs#tabs { position: sticky; top: 64px; z-index: 9; overflow: visible; flex-wrap: wrap; padding: 12px 0; }
  .tabs#tabs::before { content: ""; position: absolute; top: 0; bottom: 0; left: calc(50% - 50vw); right: calc(50% - 50vw); z-index: -1; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .tabs button { font-size: 15px; padding: 10px 18px; }
  .tabs button:hover { border-color: var(--sky); }
  .opt:hover:not(:disabled), .chips button:hover, .guide-toolbar button:hover, .st-chips button:hover { border-color: var(--sky); }
  .hero { padding: 34px 40px; border-radius: 30px; margin-top: 8px; }
  .hero::before { right: -90px; top: -90px; width: 220px; height: 220px; border-width: 46px; }
  .hero::after { right: 34px; top: 34px; width: 30px; height: 30px; }
  .hero h1 { font-size: 34px; max-width: 30ch; }
  .hero p { font-size: 16.5px; max-width: 60ch; }
  .install, .v-banner { max-width: none; }
  .v-banner { padding: 14px 20px; font-size: 15px; }
  .card:not(.sos) { padding: 20px 22px; }
  .h3 { font-size: 16px; }

  /* планировщик: шаги шире, 4 и 5 рядом */
  #view-plan:not(.hidden) { display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; align-items: start; }
  #view-plan > * { grid-column: 1 / -1; }
  #view-plan > #stepRoute { grid-column: 1; }
  #view-plan > #stepDates { grid-column: 2; }
  #view-plan > #stepRoute.hidden + #stepDates { grid-column: 1 / -1; }
  section.step { margin-top: 28px; }
  .step h2 { font-size: 17px; }
  #tiers { grid-template-columns: repeat(5, 1fr); }
  #tiers .opt { flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; }
  #cities { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .opt { padding: 14px; }
  .bar { padding-top: 12px; }
  .bar .wrap { display: flex; justify-content: center; }
  .bar .cta { max-width: 520px; }

  /* результат: слева дни, справа сводка (виза, маршрут, даты, бюджет) */
  .res-grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; column-gap: 28px; align-items: start; }
  .res-side { grid-column: 2; grid-row: 1; }
  .res-main { grid-column: 1; grid-row: 1; }
  .city-cover { height: 220px; }

  /* виза и «в поездке»: две колонки карточек */
  .cols { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; align-items: start; }
  .col { display: block; }

  /* истории мест: сетка карточек */
  .story-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 22px; align-items: start; }
  .guide-toolbar { flex-wrap: wrap; overflow: visible; }
  .guide-search { max-width: 520px; }

  /* разговорник и чек-лист: в две колонки */
  #phrases { columns: 2; column-gap: 48px; }
  #phrases .ph { break-inside: avoid; }
  #phrases .cat { break-after: avoid; }
  #phrases .cat:first-child { margin-top: 0; }
  #checks { columns: 2; column-gap: 48px; }
  #checks .chk { break-inside: avoid; }
  #phLangs { flex-wrap: wrap; overflow: visible; }

  /* окна */
  .modal-sheet { max-width: 640px; }
  .toast { bottom: 104px; }

  /* редактор сторис: картинка слева, настройки справа */
  .modal-sheet.st-sheet { max-width: 1000px; }
  .st-body { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto 1fr; column-gap: 28px; row-gap: 12px; padding: 18px 24px 24px; align-items: start; }
  .st-top { grid-column: 1; grid-row: 1 / span 3; position: static; margin: 0; padding: 0; border: 0; }
  .st-stage { height: min(68vh, 640px); }
  .st-body > .st-hint { grid-column: 2; grid-row: 1; text-align: left; }
  .st-body > .st-tabs { grid-column: 2; grid-row: 2; flex-wrap: wrap; overflow: visible; }
  .st-body > .st-panel { grid-column: 2; grid-row: 3; }
  .st-fonts { flex-wrap: wrap; overflow: visible; }
}
@media (min-width: 1280px) {
  .wrap { max-width: 1240px; }
}
/* планшет и узкий ноутбук (700–959 px): телефонная раскладка, но шире и крупнее, чтобы не было «полоски» посередине */
@media (min-width: 700px) and (max-width: 959px) {
  .wrap { max-width: 720px; padding: 0 24px; }
  .hero { padding: 28px 30px; }
  .hero h1 { font-size: 28px; max-width: 24ch; }
  .hero p { font-size: 15.5px; max-width: 52ch; }
  #tiers { grid-template-columns: repeat(3, 1fr); }
  #cities { grid-template-columns: repeat(4, 1fr); }
  .story-list { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .bar .wrap { max-width: 520px; }
}
</style>
</head>

        history: {kk: "Бұл жерде орта ғасырдан бері Коттербург деп аталған иелік болған. Габсбургтер оны 1569 жылы иеленіп, XVIII ғасырда Мария Терезия тұсында салтанатты барокко стиліндегі жазғы императорлық резиденцияға айналдырды.", ru: "В Средние века здесь находилось поместье Каттербург. Габсбурги приобрели его в 1569 году, а при императрице Марии Терезии в XVIII веке дворец превратился в пышную летнюю барочную резиденцию с 1 441 комнатой.", en: "A medieval estate known as Katterburg once stood here. The Habsburgs acquired it in 1569, and under Empress Maria Theresa in the 18th century it became their grand Baroque summer residence."},

        history: {kk: "Аудан атауы латынның trans Tiberim («Тибрдің арғы жағы») сөзінен шыққан. Антика дәуірінде мұнда теңізшілер мен қолөнершілер тұрды, ал Санта-Мария-ин-Трастевере базиликасы — Римдегі ең көне шіркеулердің бірі, мозаикалары XII–XIII ғасырларға жатады.", ru: "Название района — от латинского trans Tiberim, «за Тибром». В античности здесь жили моряки и ремесленники, а базилика Санта-Мария-ин-Трастевере — одна из старейших церквей Рима, её мозаики относятся к XII–XIII векам.", en: "The name comes from the Latin trans Tiberim, 'across the Tiber'. In antiquity sailors and craftsmen lived here, and the basilica of Santa Maria in Trastevere is one of Rome's oldest churches, with mosaics from the 12th–13th centuries."},
        fact: {kk: "Дәстүр бойынша Санта-Мария-ин-Трастевере III ғасырда папа Каликст I тұсында салынған және Римдегі Мәриям анаға арналған алғашқы шіркеу саналады.", ru: "По традиции Санта-Мария-ин-Трастевере основана в III веке при папе Каликсте I и считается первой церковью Рима, посвящённой Деве Марии.", en: "By tradition Santa Maria in Trastevere was founded in the 3rd century under Pope Callixtus I and is considered Rome's first church dedicated to the Virgin Mary."},

        tip: {kk: "Иық пен тізе жабық болуы керек, әйтпесе кіргізбейді. Күмбезге шығуды күннің бірінші жартысына брондаңыз — кезек аз.", ru: "Плечи и колени должны быть закрыты, иначе не пустят. Подъём на купол бронируйте на утро — меньше людей.", en: "Shoulders and knees must be covered or you will be turned away. Book the dome climb for the morning when it is quieter."},

        history: {kk: "Ғимаратты халықаралық байқауда жеңген сәулетші Имре Штейндль жобалаған. Құрылыс 1885 жылы басталып, ғасыр басында аяқталды. Неоготикалық сарайда 691 бөлме бар, ал күмбезінің биіктігі 96 метр — бұл венгрлер мемлекетінің құрылған 896 жылына ишара.", ru: "Здание спроектировал архитектор Имре Штейндль, победивший в международном конкурсе. Строительство началось в 1885 году и завершилось в начале XX века. В неоготическом дворце 691 помещение, а высота купола — 96 метров: это отсылка к 896 году, когда венгры пришли на эти земли.", en: "The building was designed by Imre Steindl, who won an international competition. Construction began in 1885 and was completed in the early 20th century. The neo-Gothic palace has 691 rooms, and its dome is 96 metres high — a nod to the year 896, when the Hungarians settled the land."},
        fact: {kk: "2000 жылдан бері парламенттің орталық залында Әулие Иштванның қасиетті тәжі — Венгрияның басты мемлекеттік рәмізі сақталады.", ru: "С 2000 года в центральном зале парламента хранится Святая корона Иштвана — главная государственная реликвия Венгрии.", en: "Since 2000 the Holy Crown of St Stephen, Hungary's most important state relic, has been displayed in the Parliament's central hall."},
        tip: {kk: "Ғимаратты сырттан ең әдемі көретін жер — Дунайдың арғы жағындағы Батьяни алаңы, әсіресе кешке шам жанғанда.", ru: "Лучший вид на здание — с другого берега Дуная, с площади Баттьяни, особенно вечером с подсветкой.", en: "The best view of the building is from across the Danube at Batthyány tér, especially at night when it is lit up."},

        history: {kk: "1241–1242 жылдардағы моңғол шапқыншылығынан кейін король Бела IV Қамал төбесінде алғашқы бекіністі салдырды. Кейін бұл жер корольдердің резиденциясына айналды. Сарай соғыстарда бірнеше рет қиратылып, қайта салынды, ал 1987 жылы Буда қамалы кварталы ЮНЕСКО тізіміне енді.", ru: "После монгольского нашествия 1241–1242 годов король Бела IV построил на Замковом холме первую крепость. Позже здесь была резиденция венгерских королей. Дворец не раз разрушали в войнах и отстраивали заново, а в 1987 году Будайский замковый квартал внесли в список ЮНЕСКО.", en: "After the Mongol invasion of 1241–1242, King Béla IV built the first fortress on Castle Hill, which later became the residence of Hungary's kings. The palace was destroyed in wars several times and rebuilt, and in 1987 the Buda Castle Quarter was added to the UNESCO World Heritage list."},

        history: {kk: "1508 жылдан 1918 жылға дейін Резиденция Бавария герцогтарының, курфюрстерінің және корольдерінің мекені әрі үкімет орны болды. Сарай ғасырлар бойы кеңейіп, Германиядағы ең үлкен қалалық сарайлардың біріне айналды. Екінші дүниежүзілік соғыста қатты қираған соң қалпына келтірілді.", ru: "С 1508 по 1918 год Резиденция была домом и местом правления герцогов, курфюрстов и королей Баварии. Веками дворец разрастался и стал одним из крупнейших городских дворцов Германии. После тяжёлых разрушений во Второй мировой войне его восстановили.", en: "From 1508 to 1918 the Residenz was the seat and home of Bavaria's dukes, electors and kings. Growing over the centuries into one of Germany's largest city palaces, it was rebuilt after heavy damage in the Second World War."},
        fact: {kk: "Антиквариум залы (1568–1571) герцог Альбрехт V-тің антикалық мүсіндер жинағына арнап салынған. Бұл — Альпінің солтүстігіндегі Қайта өрлеу дәуірінің ең үлкен залы.", ru: "Зал Антиквариум (1568–1571) построили для коллекции античных скульптур герцога Альбрехта V. Это крупнейший ренессансный зал к северу от Альп.", en: "The Antiquarium (1568–1571) was built for Duke Albrecht V's collection of antique sculpture — the largest Renaissance hall north of the Alps."},
        tip: {kk: "Резиденция мен Қазынаны бір күнде көрсеңіз, біріктірілген билет арзанырақ. 1 қаңтарда, Фашинг сейсенбісінде, 24, 25 және 31 желтоқсанда жабық деп жазылған — тексеріңіз.", ru: "Если смотрите Резиденцию и Сокровищницу в один день, комбинированный билет дешевле. Указано, что 1 января, во вторник Фашинга, 24, 25 и 31 декабря закрыто — проверьте.", en: "Seeing the Residenz and the Treasury on the same day? The combined ticket is cheaper. It is listed as closed on 1 January, Shrove Tuesday and 24, 25 and 31 December — check before you go."},

/* Точный перебор (Held-Karp) при n ≤ 10: O(2^n · n²), для 10 городов ~100k операций.
   ids — все выбранные города, startId — старт, endId — финиш или null (авто: минимизируем
   «часы в пути + часы обратного вылета из финиша»). */

function allocateDays(order, total) {

function buildCityDays(cityId, nDays) {

  const left = pool.slice(0, nDays * 3);
  const days = [];

    const group = [left.shift()];
    while (group.length < 3 && left.length) { // ближайшая к последней точке
      const last = group[group.length - 1]; let best = 0;
      left.forEach((s, i) => { if (km(s.ll, last.ll) < km(left[best].ll, last.ll)) best = i; });
      group.push(left.splice(best, 1)[0]);

}

  if (!W.length) return [];
  const minLo = Math.min(...W.map((x) => x.lo)), minHi = Math.min(...W.map((x) => x.hi)), maxHi = Math.max(...W.map((x) => x.hi)), maxD = Math.max(...W.map((x) => x.d));

/* ---------- Копирование ----------
   Сначала execCommand (работает в старых WebView и на iOS внутри жеста), параллельно Clipboard API.
   Если не вышло — выделяем текст, чтобы скопировать вручную. */
function copyText(text, btn, selectEl) {
  let ok = false;
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;left:-9999px;top:0;font-size:16px;opacity:0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    ok = document.execCommand("copy");
    ta.remove();
  } catch (e) { ok = false; }
  const done = () => {
    toast(t("copied"));
    if (btn) { const old = btn.dataset.label || btn.innerHTML; btn.dataset.label = old; btn.innerHTML = "✓ " + t("copiedShort"); btn.classList.add("done"); setTimeout(() => { btn.innerHTML = old; btn.classList.remove("done"); }, 1800); }
  };
  const fail = () => {
    if (selectEl) { try { const rg = document.createRange(); rg.selectNodeContents(selectEl); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rg); } catch (e) {} }
    toast(t("copyManual"));
  };
  if (ok) done();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => { if (!ok) done(); }, () => { if (!ok) fail(); });
  } else if (!ok) fail();
}
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
}
// Telegram Mini App: внешние ссылки открываем через API Telegram, иначе WebView может их не открыть
function openExternal(url) {
  if (!tg) return false;
  try {
    if (/^https:\/\/t\.me\//.test(url) && tg.openTelegramLink) { tg.openTelegramLink(url); return true; }
    if (tg.openLink) { tg.openLink(url); return true; }
  } catch (e) {}
  return false;
}

/* ---------- Ссылка на маршрут ----------
   Весь план — в коротком коде после «#trip=», например …/#trip=2x-viropa-d10-p2-20270726:
   уровень (0–4) + стиль (c/m/x), города по 2 буквы в порядке выбора, d<дни>, p<люди>, дата старта ГГГГММДД,

   тот же код подойдёт для ссылки Telegram Mini App (t.me/<бот>/<app>?startapp=<код>), когда появится бот.
   Код идёт после «#», поэтому не уходит на сервер. Коды городов НЕ менять: старые ссылки перестанут открываться.

  // убираем код из адреса: перезагрузка не должна затирать то, что клиент поменял после открытия ссылки
  try {
    const [h, q] = linkParams();
    if (["trip", "book"].some((k) => h.has(k) || q.has(k))) {
      ["trip", "book"].forEach((k) => { h.delete(k); q.delete(k); });
      const qs = q.toString(), hs = h.toString();
      history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "") + (hs ? "#" + hs : ""));
    }
  } catch (e) {}
  const p = parseTripCode(inc.code); if (!p) return null;
  Object.assign(S, p); savePlan(); S.view = "result";
  return inc;
}

  // Telegram: своё окно «Переслать»; телефон: системное меню «Поделиться»; компьютер: копируем текст со ссылкой

const MODE_EN = {train: "by train", flight: "by plane", mixed: "by plane and train", bus: "by bus"};

  const plan = planTrip(v.route, v.per, v.start);
  v.route.order.forEach((id, ci) => {
    const c = CITIES[id];
    plan.days.filter((x) => x.ci === ci).map((x) => x.day).forEach((day, i) => {
      const parts = [];
      if (n === 0) parts.push(`Arrival in ${c.name.en} from Kazakhstan.`);
      if (i === 0 && ci > 0) { const l = v.route.legs[ci - 1], prev = v.route.order[ci - 1]; parts.push(`Travel ${CITIES[prev].name.en} -> ${c.name.en} ${MODE_EN[l.mode] || ""}${l.via ? ` (${enOf(l.via)})` : ""}.`); }
      if (day.spots) parts.push("Sightseeing: " + day.spots.map((s) => enOf(s.n)).join(", ") + ".");

      else parts.push("Free day in the city.");

    ["Route", v.route.order.map((id) => `${CITIES[id].name.en} (${CITIES[id].country.en})`).join(" -> ")]

// WinAnsi (стандартные шрифты PDF): латиница; буквы с диакритикой вне Latin-1 → без знака; эмодзи убираем
const PDF_MAP = {"€": 128, "‚": 130, "ƒ": 131, "„": 132, "…": 133, "†": 134, "‡": 135, "ˆ": 136, "‰": 137, "Š": 138, "‹": 139, "Œ": 140, "Ž": 142, "‘": 145, "’": 146, "“": 147, "”": 148, "•": 149, "–": 150, "—": 151, "˜": 152, "™": 153, "š": 154, "›": 155, "œ": 156, "ž": 158, "Ÿ": 159, "→": "->", "←": "<-", "≈": "~", " ": " "};

  let out = "";
  for (const ch of String(s).normalize("NFC")) {
    const m = PDF_MAP[ch], c = ch.codePointAt(0);
    if (typeof m === "number") out += String.fromCharCode(m);
    else if (typeof m === "string") out += m;
    else if (c < 128 || (c >= 160 && c < 256)) out += ch;
    else { const base = ch.normalize("NFD")[0]; if (base.codePointAt(0) < 128) out += base; }
  }
  return out;
}
const pdfEsc = (s) => s.replace(/[\\()]/g, "\\$&");
const pdfW = (s, size, bold) => [...s].reduce((w, c) => w + (/[il.,:;'|!]/.test(c) ? 0.28 : /[ftjrI()\- ]/.test(c) ? 0.33 : /[mwMW]/.test(c) ? 0.86 : /[A-Z]/.test(c) ? 0.69 : /[0-9]/.test(c) ? 0.56 : 0.53), 0) * size * (bold ? 1.07 : 1);

  const lines = []; let line = "";
  for (const w of s.split(/\s+/).filter(Boolean)) { const tst = line ? line + " " + w : w; if (pdfW(tst, size, bold) > maxW && line) { lines.push(line); line = w; } else line = tst; }
  if (line) lines.push(line);
  return lines;
}
function makeItineraryPdf() {
  const it = itinerary(); if (!it) return null;

  // text() получает уже перекодированную строку (pdfStr), повторно не перекодируем
  const text = (s, x, size, bold, color) => ops().push(`BT ${color || INK} rg /${bold ? "F2" : "F1"} ${size} Tf ${x.toFixed(1)} ${y.toFixed(1)} Td (${pdfEsc(s)}) Tj ET`);
  const para = (s, x, size, bold, w, lh, color) => pdfWrap(pdfStr(s), size, bold, w).forEach((ln) => { if (y < 60) newPage(); text(ln, x, size, bold, color); y -= lh; });
  ops().push("0.106 0.702 0.82 rg 0 830 595 12 re f");
  y = 792; text("TRAVEL ITINERARY", M, 20, true); y -= 26;
  it.head.forEach(([k, v]) => { const kw = 112; if (y < 60) newPage(); text(pdfStr(k + ":"), M, 10.5, true, GREY); const lines = pdfWrap(pdfStr(v), 10.5, false, W - kw); lines.forEach((ln, i) => { if (i) { y -= 14; if (y < 60) newPage(); } text(ln, M + kw, 10.5, false); }); y -= 17; });
  y -= 4; ops().push(`0.86 0.91 0.93 RG 1 w ${M} ${y + 6} m ${M + W} ${y + 6} l S`); y -= 16;
  it.rows.forEach((r) => {
    const planLines = pdfWrap(pdfStr(r.plan), 10, false, W - 16);
    if (y - 18 - planLines.length * 13.5 < 60) newPage();
    text(pdfStr(`Day ${r.day}  |  ${r.date}  |  ${r.city}`), M, 11, true); y -= 15;
    planLines.forEach((ln) => { text(ln, M + 16, 10, false); y -= 13.5; });
    y -= 8;
  });
  y -= 6; para(ITIN_FOOT, M, 9.5, false, W, 12, GREY);
  y -= 4; para(`Prepared with ${CONTACT.brand}: ${CONTACT.site}`, M, 8.5, false, W, 11, GREY);
  const objs = [];
  objs[1] = "<< /Type /Catalog /Pages 2 0 R >>";
  objs[3] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objs[4] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  const kids = [];
  pages.forEach((p, i) => {
    const pid = 5 + i * 2, stream = p.join("\n"); kids.push(pid + " 0 R");
    objs[pid] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${pid + 1} 0 R >>`;
    objs[pid + 1] = `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;
  });
  objs[2] = `<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${pages.length} >>`;
  let pdf = "%PDF-1.4\n%âãÏÓ\n";
  const off = [];
  for (let i = 1; i < objs.length; i++) { off[i] = pdf.length; pdf += `${i} 0 obj\n${objs[i]}\nendobj\n`; }
  const xref = pdf.length;
  pdf += `xref\n0 ${objs.length}\n0000000000 65535 f \n${off.slice(1).map((o) => String(o).padStart(10, "0") + " 00000 n \n").join("")}trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;

}
async function visaPdf() {

/* ---------- Сапар кітапшасы: PDF на языке приложения ----------
   Стандартные шрифты PDF не знают кириллицы, а встроить свой шрифт — сотни КБ в файле приложения. Поэтому каждую
   страницу рисуем на canvas шрифтом телефона (казахские буквы и эмодзи есть везде), кладём в PDF картинкой JPEG,
   а поверх — кликабельные ссылки (карты, телефоны, WhatsApp, сам план). Фото — встроенные превью: работает без интернета.
   Страница A4 в пунктах (595×842), рисуем ×2 (≈145 dpi): чётко на телефоне и при печати. Текст из PDF не копируется —
   для визы есть отдельный текстовый PDF на английском (visaPdf). */
const BK = {W: 595, H: 842, M: 40, K: 2, FOOT: 30};
const BK_C = {ink: "#0B2545", muted: "#5A6677", sky: "#1BB3D1", deep: "#0B7F97", sun: "#FFC22E", soft: "#E5F2F1", line: "#E6DED1",
  warn: "#7A5800", bad: "#8A2414", white: "#FFFFFF"};
const BK_FONT = "'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif";
const BK_HEAD = "'Montserrat', " + BK_FONT;
const bkDM = (d) => (S.lang === "kk" ? `${d.getDate()} ${KK_MON[d.getMonth()]}` : d.toLocaleDateString(S.lang === "en" ? "en-GB" : "ru-RU", {day: "numeric", month: "short"}));
const bkRange = (ds) => (!ds.length ? "" : ds.length === 1 ? bkDM(ds[0]) : `${bkDM(ds[0])} – ${bkDM(ds[ds.length - 1])}`);
// «перо»: текущая страница, позиция y (сверху вниз, в пунктах), перенос строк и страниц, ссылки
function bookWriter() {
  const {W, H, M, K} = BK, CW = W - 2 * M, BOTTOM = H - BK.FOOT - 16, pages = [];
  let ctx = null, y = 0;
  const B = {
    CW, pages,
    get y() { return y; }, set y(v) { y = v; },
    get ctx() { return ctx; },
    page() {
      const cv = document.createElement("canvas"); cv.width = W * K; cv.height = H * K;
      ctx = cv.getContext("2d"); ctx.scale(K, K); ctx.fillStyle = BK_C.white; ctx.fillRect(0, 0, W, H);
      pages.push({cv, ctx, links: []}); y = M;
    },
    need(h) { if (y + h > BOTTOM) B.page(); },
    font(size, weight, head) { ctx.font = `${weight || 400} ${size}px ${head ? BK_HEAD : BK_FONT}`; },
    lines(str, size, weight, maxW, head) { B.font(size, weight, head); return String(str).split("\n").flatMap((p) => (p.trim() ? wrapLines(ctx, p, maxW) : [""])); },
    height(str, size, weight, maxW, head) { return B.lines(str, size, weight, maxW, head).length * size * 1.45; },
    // одна строка; yy — верх строки
    put(str, x, yy, o = {}) {
      const size = o.size || 10; B.font(size, o.weight, o.head); ctx.fillStyle = o.color || BK_C.ink;
      const w = ctx.measureText(str).width, left = o.align === "right" ? x - w : x;
      ctx.fillText(str, left, yy + size);
      if (o.url) B.link(left, yy - 1, w, size * 1.45, o.url);
      return w;
    },
    // абзац: перенос по словам и, если надо, на новую страницу
    text(str, o = {}) {
      const size = o.size || 10, lh = size * 1.45, x = o.x !== undefined ? o.x : M, maxW = o.w || CW - (x - M);
      B.lines(str, size, o.weight, maxW, o.head).forEach((ln) => {
        if (y + lh > BOTTOM) B.page();
        B.put(ln, x, y + lh * 0.04, {...o, size});
        y += lh;
      });
    },
    link(x, yy, w, h, url) { if (url) pages[pages.length - 1].links.push({x, y: yy, w, h, url}); },
    rect(x, yy, w, h, r, fill) { ctx.fillStyle = fill; roundRect(ctx, x, yy, w, h, r); ctx.fill(); },
    img(im, x, yy, w, h, r) {
      if (!im || !im.width) { B.rect(x, yy, w, h, r, BK_C.soft); return; }
      const s = Math.max(w / im.width, h / im.height), sw = w / s, sh = h / s;
      ctx.save(); roundRect(ctx, x, yy, w, h, r); ctx.clip();
      ctx.drawImage(im, (im.width - sw) / 2, (im.height - sh) / 2, sw, sh, x, yy, w, h); ctx.restore();
    },
    // заголовок раздела — не оставляем один внизу страницы
    title(str, keep) { B.need((keep || 60) + 34); y += 4; B.text(str, {size: 16, weight: 800, head: true}); ctx.fillStyle = BK_C.sun; ctx.fillRect(M, y + 1, 34, 3); y += 14; },
    sub(str, keep) { B.need((keep || 40) + 24); y += 10; B.text(str, {size: 12, weight: 800, head: true}); y += 3; }
  };
  return B;
}

// одно место дня: превью, название (ссылка на карту), цена и часы, заметка, предупреждение о закрытии

  const {M} = BK, tw = 66, th = 44, x = M + tw + 10, w = B.CW - tw - 10;

  const hTxt = B.height(L(s.n), 11, 700, w) + (meta ? 9 * 1.45 : 0) + (note ? B.height(note, 8.5, 400, w) : 0) + (warn ? B.height(warn, 8.5, 600, w) : 0);

  const top = B.y, url = mapsSearch(mapQ(s.w, cityId));

// PDF из страниц-картинок: на страницу — JPEG во весь лист и кликабельные области ссылок

  pages.forEach((p, i) => {
    const im = add([`<< /Type /XObject /Subtype /Image /Width ${p.cv.width} /Height ${p.cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpgs[i].length} >>\nstream\n`, jpgs[i], "\nendstream"]);
    const cs = `q ${BK.W} 0 0 ${BK.H} 0 0 cm /Pg Do Q`, ct = add(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    const an = p.links.map((l) => add(`<< /Type /Annot /Subtype /Link /Rect [${f(l.x)} ${f(BK.H - l.y - l.h)} ${f(l.x + l.w)} ${f(BK.H - l.y)}] /Border [0 0 0] /A << /S /URI /URI ${pdfLit(l.url)} >> >>`));
    kids.push(add(`<< /Type /Page /Parent ${root} 0 R /MediaBox [0 0 ${BK.W} ${BK.H}] /Resources << /XObject << /Pg ${im} 0 R >> >> /Contents ${ct} 0 R${an.length ? ` /Annots [${an.map((x) => x + " 0 R").join(" ")}]` : ""} >>`));
  });
  objs[catalog - 1] = `<< /Type /Catalog /Pages ${root} 0 R >>`;
  objs[root - 1] = `<< /Type /Pages /Kids [${kids.map((x) => x + " 0 R").join(" ")}] /Count ${kids.length} >>`;

  objs.forEach((o, i) => { offs.push(len); put(`${i + 1} 0 obj\n`); (Array.isArray(o) ? o : [o]).forEach(put); put("\nendobj\n"); });
  const xref = len;
  put(`xref\n0 ${objs.length + 1}\n0000000000 65535 f \n${offs.map((o) => String(o).padStart(10, "0") + " 00000 n \n").join("")}trailer\n<< /Size ${objs.length + 1} /Root ${catalog} 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF\n`);

/* Сохранение: iPhone и Telegram — меню «Поделиться» (там «Сохранить в Файлы», WhatsApp, Telegram); компьютер и Android — скачивание.

let bookCache = null;

    try { await navigator.share({files: [file]}); return; } catch (e) { if (e && e.name === "AbortError") return; }

}
async function bookPdf(btn) {
  if (bookPdf.busy) return;

  if (tg && !canShareFiles() && bookInBrowser()) return;
  bookPdf.busy = true;
  if (btn) { btn.disabled = true; btn.innerHTML = "⏳ " + t("bookMaking"); }
  try {
    const blob = await makeBookPdf(); if (!blob) { toast(t("visaNeedPlan")); return; }

const TR = {а: "a", б: "b", в: "v", г: "g", д: "d", е: "e", ё: "yo", ж: "zh", з: "z", и: "i", й: "y", к: "k", л: "l", м: "m", н: "n", о: "o", п: "p", р: "r", с: "s", т: "t", у: "u", ф: "f", х: "kh", ц: "ts", ч: "ch", ш: "sh", щ: "shch", ъ: "", ы: "y", ь: "", э: "e", ю: "yu", я: "ya"};

  else if (b.dataset.routeMode) { S.manual = b.dataset.routeMode === "manual"; }
  else if (b.dataset.move) {
    const [id, dir] = b.dataset.move.split(":"), i = S.cities.indexOf(id), j = i + Number(dir);
    if (i < 0 || j < 0 || j >= S.cities.length) return;
    [S.cities[i], S.cities[j]] = [S.cities[j], S.cities[i]];
  }
  else if (b.dataset.visit) { if (S.visited[b.dataset.visit]) delete S.visited[b.dataset.visit]; else S.visited[b.dataset.visit] = true; store.set("visited", S.visited); }
  else if (b.dataset.pastToggle !== undefined) { S.showPast = !S.showPast; }
  else if (b.dataset.visitedToggle !== undefined) { S.showVisited = !S.showVisited; }
  else if (b.dataset.start) { S.startCity = b.dataset.start; if (S.endCity === S.startCity) S.endCity = null; }
  else if (b.dataset.end) { if (b.dataset.end === "auto") S.autoEnd = true; else { S.autoEnd = false; S.endCity = b.dataset.end; } }
  else if (b.dataset.days) { const chosen = +b.dataset.days; if (chosen < S.cities.length) return; S.days = chosen; }
  else if (b.dataset.ph) { S.phLang = b.dataset.ph; render(); return; }
  else if (b.dataset.prCity) { S.prCity = b.dataset.prCity; render(); return; }
  else if (b.dataset.eat) { const [id, k] = b.dataset.eat.split(":"); S.eatTab[id] = k; renderEat(id); return; }
  else if (b.dataset.say) { const p = PHRASES[S.phLang]; speak(p.list[+b.dataset.say][1], p.tl, b); return; }
  else if (b.id === "go") { S.view = "result"; haptic(); render(); window.scrollTo(0, 0); return; }
  else if (b.id === "back") { S.view = "plan"; render(); return; }
  else return;
  haptic(); savePlan(); render();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#modalBackdrop").classList.contains("hidden")) closeModal(); });
document.addEventListener("input", (e) => {
  if (e.target.id === "guideSearch") { S.guideQuery = e.target.value; $("#guideCards").innerHTML = guideCardsHTML(); return; }
  if (stInput(e.target)) return;
  if (e.target.id === "vName") { S.vname = e.target.value; return; }
  if (e.target.id === "cvAmount") { S.cv.amount = e.target.value; $("#cvOut").innerHTML = cvOutHTML(); return; }
  if (e.target.id === "vpIssued" || e.target.id === "vpExpires") { S.passport[e.target.id === "vpIssued" ? "issued" : "expires"] = e.target.value; $("#vpResult").innerHTML = passportResultHTML(); }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "start") { S.start = e.target.value || S.start; savePlan(); }
  if (e.target.id === "people") { S.people = Math.max(1, Math.min(10, +e.target.value || 1)); savePlan(); }
  if (e.target.dataset.chk !== undefined) { S.checks[e.target.dataset.chk] = e.target.checked; store.set("checks", S.checks); renderChecks(); }
  if (e.target.dataset.vdoc !== undefined) { S.vdocs[e.target.dataset.vdoc] = e.target.checked; store.set("vdocs", S.vdocs); $("#vdocCount").textContent = `${visaDocsDone()}/${VISA.docs.length}`; }
  if (e.target.id === "vpIssued" || e.target.id === "vpExpires") { S.passport[e.target.id === "vpIssued" ? "issued" : "expires"] = e.target.value; $("#vpResult").innerHTML = passportResultHTML(); }
  if (e.target.id === "stFile") { stOwnPhoto(e.target.files && e.target.files[0]); e.target.value = ""; }
});

/* ---------- Курс валют (живой; при ошибке — FX из блока qz-data) ---------- */
async function loadRate() {
  const cached = store.get("rate", null);
  if (cached && Number.isFinite(cached.CHF) && Number.isFinite(cached.HUF) && Date.now() - cached.ts < 864e5) { S.rate = cached; if (S.view === "result") render(); return; }
  try {
    const j = await (await fetch("https://open.er-api.com/v6/latest/EUR")).json();
    if (j.result !== "success") throw new Error("rate");
    S.rate = {KZT: j.rates.KZT, USD: j.rates.USD, CHF: j.rates.CHF, HUF: j.rates.HUF, CZK: j.rates.CZK, date: new Date(j.time_last_update_unix * 1000).toISOString().slice(0, 10).split("-").reverse().join("."), ts: Date.now()};
    store.set("rate", S.rate);
  } catch (e) { S.rate = cached || null; }
  if (S.view === "result" || S.view === "trip") render();
}

// для тестов и отладки (console): window.QZ.optimizeRoute(["vienna","rome"], "vienna", null)
window.QZ = {optimizeRoute, allocateDays, pathHours, S, render, visaTrip, visaMessage, itineraryText, makeItineraryPdf, photoSlug, openStoryStudio, stBlob,
  easterDate, closureOn, holidayOn, dayNotes, planCity, planTrip, cvOutHTML, renderTrip, prayerTimes, qiblaDeg, prayerNear, renderPrayer,
  TRIP_CODE, tripCode, parseTripCode, shareUrl, tripMessage, makeBookPdf};
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
// тема: синхронизируем цвет шапки браузера/Telegram; пока клиент сам не выбрал — следуем за телефоном и Telegram
setTheme(curTheme(), false);
try {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  mq.addEventListener("change", (e) => { if (store.get("theme", null) === null && !(tg && tg.initData)) setTheme(e.matches ? "dark" : "light", false); });
} catch (e) {}
if (tg && tg.initData) { try { tg.onEvent("themeChanged", () => { if (store.get("theme", null) === null) setTheme(tg.colorScheme === "dark" ? "dark" : "light", false); }); } catch (e) {} }
// офлайн-режим и установка на телефон: только на https-хостинге (на file:// не работает)
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
// присланная ссылка на маршрут (#trip=…): сразу открываем этот план на странице результата
const incoming = applyIncomingTrip();
function firstRender() {
  render();
  if (!incoming) return;
  toast(t("shareOpened"));
  // пришли из Telegram за PDF (…&book=1): подсвечиваем кнопку кітапшы
  const b = incoming.book && $("[data-book-pdf]");
  if (b) { b.scrollIntoView({block: "center"}); b.classList.add("pulse"); toast(t("bookTapHint")); }
}
// первый рендер — когда весь файл прочитан: к этому моменту блок встроенных превью THUMBS уже загружен
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", firstRender); else firstRender();
loadRate();
</script>
